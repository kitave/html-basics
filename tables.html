<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 65%;
            border:1px solid #1a0202;
            margin:auto;
            border-collapse: collapse;  /* merge borders */
        }

        th{
            color: #d2691e;
            border: #1a0202 solid 1px;
            padding: 10px 7px;
            text-align: center;
        }

        td{
            color: #d12e0d;
            border: #080808 solid 1px;
            padding: 10px 7px;
            text-align: center;
        }

        .salary{
            color: #7c0b84;
            font-weight: bold;
        }

        #xyz{
            color: #0b84a1;
            font-weight: bold;
        }

        /* CSS Frameworks -- Bootstrap */
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th id="xyz">First Name</th>
                <th>Last Name</th>
                <th>City</th>
                <th>Age</th>
                <th>Salary</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Jane</td>
                <td>Doe</td>
                <td>Nairobi</td>
                <td>33</td>
                <td class = "salary">33,000</td>
            </tr>
            <tr>
                <td>John</td>
                <td>Doe</td>
                <td>Mombasa</td>
                <td>30</td>
                <td class = "salary">30,000</td>
            </tr>
            <tr>
                <td>Mary</td>
                <td>Doe</td>
                <td>Kisumu</td>
                <td>28</td>
                <td class = "salary">28,000</td>
            </tr>
            <tr>
                <td>Mark</td>
                <td>Doe</td>
                <td>Nakuru</td>
                <td>25</td>
                <td class = "salary">25,000</td>
            </tr> 
            <tr>
                <td>Mike</td>
                <td>Doe</td>
                <td>Eldoret</td>
                <td>23</td>
                <td class = "salary">23,000</td>
            </tr>
        </tbody>
    </table>

    <!-- Lists unordered -->
     <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Python</li>
        <li>Java</li>
     </ul>
</body>
</html>
