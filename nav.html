<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Edu+QLD+Hand:wght@400..700&display=swap');
        

        *{
            padding: 0;
            margin: 0;
        }

        body{
            font-family: "Edu QLD Hand", sans-serif;
        }

        nav{
            display: flex;
            justify-content: center;
            border-bottom: 1px solid #020006;
            /* background: #0f0f0f; */
        }

        .nav-items{
            width: 80%;
            /* background: #f6d57a; */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-items ul{
            display: flex;
            list-style: none;
            
        }

        .nav-items li{
            margin-right: 20px;
            margin-left: 20px;
        }

        .nav-items a{
            text-decoration: none;
            color: #0f0f0f;
            /* font-size: 20px; */
        }

    </style>
</head>

<body>
    <!-- semantic tags -->
     <nav>
        <div class="nav-items">
            <img src="images/icons8-finder-64.png" alt="company logo">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
     </nav>

     <footer>

     </footer>
</body>

</html>
